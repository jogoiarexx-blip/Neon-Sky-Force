name: Assemble Neon Sky Force v1.6

on:
  push:
    paths:
      - ".github/workflows/assemble-v16.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble exact v1.6 scripts
        shell: bash
        run: |
          set -euo pipefail
          cat publish_chunks/payload_*.b64 > /tmp/neon-v16.b64
          base64 -d /tmp/neon-v16.b64 > /tmp/neon-v16.tar.gz
          tar -xzf /tmp/neon-v16.tar.gz
          rm -f js/v15-overhaul.js
          rm -rf publish_chunks

          test -f js/game.js
          test -f js/v16-streaming.js
          test "$(wc -c < js/game.js)" -eq 129416
          test "$(wc -c < js/v16-streaming.js)" -eq 58784

      - name: Commit v1.6
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publica Neon Sky Force v1.6 Streaming Stages"
            git push
          fi
